<!DOCTYPE html>
<html>
<head>
    <title>Palworld Admin Dashboard</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 800px; margin: 2rem auto; padding: 2rem; background-color: #f8f9fa; border-radius: 12px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">

    <h1 style="text-align: center; color: #333;">🌍 Palworld Server Dashboard</h1>

    <p><strong>Server IP (Tailscale):</strong> <code>{{ ip }}:8211</code></p>
    <p>Status: <strong style="color: {{ 'green' if status else 'red' }}">{{ 'Running' if status else 'Stopped' }}</strong></p>

    <div style="margin-bottom: 2rem;">
        <form method="post" action="/start" style="display: inline;">
            <button type="submit" style="background-color: #28a745; color: white; padding: 0.5rem 1rem; border: none; border-radius: 6px;">▶ Start</button>
        </form>
        <form method="post" action="/stop" style="display: inline;">
            <button type="submit" style="background-color: #dc3545; color: white; padding: 0.5rem 1rem; border: none; border-radius: 6px;">■ Stop</button>
        </form>
        <form method="post" action="/restart" style="display: inline;">
            <button type="submit" style="background-color: #ffc107; color: black; padding: 0.5rem 1rem; border: none; border-radius: 6px;">🔁 Restart</button>
        </form>
        <form method="post" action="/backup_game" style="display: inline;">
            <button type="submit" style="background-color: #007bff; color: white; padding: 0.5rem 1rem; border: none; border-radius: 6px;">💾 Backup Game Save</button>
        </form>
    </div>

    <h2 style="margin-top: 2rem; color: #444;">⚙️ Game Settings</h2>

    <form method="post" action="/save" style="background-color: #fff; padding: 1rem; border-radius: 8px; border: 1px solid #ddd;">
        {% for key, value in settings.items() %}
            <div style="margin-bottom: 0.8rem;">
                <label style="display: inline-block; width: 240px; font-weight: bold;">{{ key }}:</label>
                <input type="text" name="{{ key }}" value="{{ value }}" style="width: 300px; padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px;">
            </div>
        {% endfor %}
        <button type="submit" style="margin-top: 1rem; background-color: #17a2b8; color: white; padding: 0.6rem 1.2rem; border: none; border-radius: 6px;">💾 Save Settings</button>
    </form>

</body>
</html>
